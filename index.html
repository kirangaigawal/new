<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stanzza - Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--cream:#F4F3EB;--ink:#1E1E1E;--white:#FFF;--radius:2px;--fd:"Instrument Serif","Palatino Linotype",serif;--fb:"Helvetica Neue","Helvetica Condensed","Arial Narrow",Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--fb);color:var(--white);background:var(--ink);-webkit-font-smoothing:antialiased}
.hero{position:relative;height:100vh;min-height:640px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-image{position:absolute;inset:0;z-index:0}
.image-hero{width:100%;height:100%;object-fit:cover;object-position:center 40%;animation:heroZoom 18s ease-out forwards}
@keyframes heroZoom{from{transform:scale(1.14)}to{transform:scale(1.02)}}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,30,30,.22) 0%,rgba(30,30,30,.10) 40%,rgba(30,30,30,.55) 100%),linear-gradient(90deg,rgba(30,30,30,.35) 0%,rgba(30,30,30,.05) 60%)}
.hero-mark{position:absolute;right:-0.5vw;bottom:6vh;z-index:2;font-size:clamp(4rem,11vw,11rem);font-weight:300;letter-spacing:.18em;color:rgba(255,255,255,.10);pointer-events:none;user-select:none;writing-mode:vertical-rl;transform:rotate(180deg)}
.lux-head{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:28px clamp(24px,5vw,72px)}
.brand{display:inline-flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--white)}
.brand-word{font-size:22px;font-weight:600;letter-spacing:.02em}
.brand-tag{font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.7}
.menu-btn{display:flex;flex-direction:column;gap:5px;width:34px;padding:6px 0}
.menu-btn span{display:block;height:1px;background:var(--white);opacity:.9}
.hero-content{position:relative;z-index:3;max-width:1200px;width:100%;padding:0 clamp(24px,5vw,72px)}
.slogan-items{display:flex;flex-wrap:wrap;align-items:center;gap:14px 10px;margin-bottom:clamp(28px,4vh,48px)}
.slogan-caption{font-size:11px;font-weight:500;letter-spacing:.38em;text-transform:uppercase;color:var(--white);opacity:.92}
.slogan-cross{color:var(--white);font-size:13px;line-height:1;opacity:.7}
.hero h1{font-family:var(--fd);font-weight:400;font-size:clamp(2.6rem,6.5vw,5rem);line-height:1.06;letter-spacing:-.01em;margin-bottom:clamp(16px,2.5vh,32px);max-width:820px;animation:fadeUp .9s .3s both ease-out}
.hero .subtitle{font-size:clamp(14px,1.2vw,18px);line-height:1.7;opacity:.78;max-width:480px;margin-bottom:clamp(24px,3vh,40px);animation:fadeUp .9s .5s both ease-out}
.u-btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--fb);font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;padding:16px 36px;border:1px solid var(--white);color:var(--white);background:var(--ink);border-radius:var(--radius);cursor:pointer;transition:background .3s,color .3s,border-color .3s;animation:fadeUp .9s .7s both ease-out}
.u-btn:hover{background:var(--white);color:var(--ink)}
.hero-caption{position:absolute;bottom:clamp(24px,3vh,48px);left:clamp(24px,5vw,72px);z-index:3;font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.55;color:var(--white)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){.lux-head{padding:20px 20px}.hero-content{padding:0 20px}.hero-mark{display:none}.brand-tag{display:none}}
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="hero-image">
    <img src="hero1.png" alt="Stanzza residential interior" class="image-hero" loading="eager">
    <div class="hero-overlay"></div>
  </div>

  <div class="hero-mark">COMPOSED</div>

  <nav class="lux-head">
    <a href="#" class="brand">
      <span class="brand-word">Stanzza</span>
      <span class="brand-tag">Design Studio</span>
    </a>
    <div class="menu-btn">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <div class="hero-content">
    <div class="slogan-items">
      <span class="slogan-caption">Architecture</span>
      <span class="slogan-cross">&#10005;</span>
      <span class="slogan-caption">Design</span>
      <span class="slogan-cross">&#10005;</span>
      <span class="slogan-caption">Delivery</span>
    </div>
    <h1>Composed residential interiors</h1>
    <p class="subtitle">Interiors designed as one complete whole.</p>
    <a href="#" class="u-btn">Request a call</a>
  </div>

  <p class="hero-caption">Image: View from the Winter Residence</p>
</section>
</body>
</html>
